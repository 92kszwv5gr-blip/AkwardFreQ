name: CI

# Two jobs:
#   tests-linux  Debug build of the automated tests (JUCE assertions on) in a clean Ubuntu environment.
#   windows      MSVC: the same tests, then the real Windows VST3 and Standalone, uploaded as a build artifact.
# The ONNX Runtime model file (htdemucs.onnx, ~300 MB) is not needed to build or test, so it is not fetched.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ORT_VERSION: 1.20.1

jobs:
  tests-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ make \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libfreetype-dev libfontconfig1-dev libgtk-3-dev

      - name: Download ONNX Runtime
        run: |
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" | tar xz -C "$RUNNER_TEMP"
          echo "ORT_DIR=$RUNNER_TEMP/onnxruntime-linux-x64-${ORT_VERSION}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build-test -DAFQ_BUILD_TESTS=ON -DONNXRUNTIME_ROOT_DIR="$ORT_DIR" -DCMAKE_BUILD_TYPE=Debug -DCOPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build tests
        run: cmake --build build-test --target AkwardFreQTests --parallel 4

      - name: Run tests
        run: ctest --test-dir build-test --output-on-failure

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" -OutFile "$env:RUNNER_TEMP\ort.zip"
          Expand-Archive "$env:RUNNER_TEMP\ort.zip" -DestinationPath $env:RUNNER_TEMP
          "ORT_DIR=$env:RUNNER_TEMP\onnxruntime-win-x64-$env:ORT_VERSION" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure (Visual Studio 2022, x64)
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DAFQ_BUILD_TESTS=ON "-DONNXRUNTIME_ROOT_DIR=$env:ORT_DIR" -DCOPY_PLUGIN_AFTER_BUILD=OFF

      # Debug, so JUCE's assertions are active; they have caught real bugs (an out-of-range read in the MIDI transcriber).
      - name: Build tests
        shell: pwsh
        run: cmake --build build --config Debug --target AkwardFreQTests --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Build VST3 and Standalone (Release)
        shell: pwsh
        run: cmake --build build --config Release --target AkwardFreQ_VST3 AkwardFreQ_Standalone --parallel

      - name: Check the build output
        shell: pwsh
        run: |
          $vst3 = "build\AkwardFreQ_artefacts\Release\VST3\AkwardFreQ.vst3"
          $exe  = "build\AkwardFreQ_artefacts\Release\Standalone\AkwardFreQ.exe"
          $missing = @()
          foreach ($p in @($vst3, "$vst3\Contents\x86_64-win\AkwardFreQ.vst3", $exe)) { if (-not (Test-Path $p)) { $missing += $p } }
          # onnxruntime.dll must sit next to the plugin binary or the host cannot load it.
          $dllNextToPlugin = Test-Path "$vst3\Contents\x86_64-win\onnxruntime.dll"
          Get-ChildItem -Recurse "build\AkwardFreQ_artefacts\Release" | Where-Object { -not $_.PSIsContainer } | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName.Substring($PWD.Path.Length + 1) }
          if ($missing.Count -gt 0) { throw "Missing build output: $($missing -join ', ')" }
          if (-not $dllNextToPlugin) { Write-Warning "onnxruntime.dll is not inside the .vst3 bundle; the package step copies it beside the Standalone exe only" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\AkwardFreQ_artefacts\Release\VST3\AkwardFreQ.vst3" dist\
          Copy-Item "build\AkwardFreQ_artefacts\Release\Standalone\AkwardFreQ.exe" dist\
          Copy-Item "$env:ORT_DIR\lib\onnxruntime.dll" dist\
          Copy-Item "$env:ORT_DIR\lib\onnxruntime.dll" "dist\AkwardFreQ.vst3\Contents\x86_64-win\" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: AkwardFreQ-Windows-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
